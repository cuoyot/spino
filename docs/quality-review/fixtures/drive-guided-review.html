<!doctype html><html lang="es" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spino · configura tus copias</title><link rel="stylesheet" href="/src/companion/theme.css"><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/layout.css"><link rel="stylesheet" href="/src/companion/app.css"><style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui;margin:0;padding:20px;background:#f4f5fb;color:#172130}body>p{max-width:560px;margin:0 auto 16px;color:#526071}#app-shell{position:static;display:block;max-width:560px;margin:auto;overflow:visible;border-radius:20px;padding:22px;color-scheme:light;--ink:#172130;--subtle:#526071;--line:#d8dce6;--cream:#f4f5fb;--green:#2861d5;--theme-text:#172130;--theme-muted:#526071;--theme-bg:#f4f5fb;--theme-line:#d8dce6;--theme-accent:#2861d5}#cp-dialog{font:16px/1.5 system-ui;--ink:#172130;--subtle:#526071;--line:#d8dce6;--cream:#f4f5fb;--green:#2861d5;--theme-text:#172130;--theme-muted:#526071;--theme-bg:#f4f5fb;--theme-line:#d8dce6;--theme-accent:#2861d5;color:#172130;background:#f4f5fb;color-scheme:light;max-width:520px;width:calc(100% - 32px)}#cp-dialog::backdrop{background:#17213066}.cp-row{gap:20px;align-items:start}.cp-row span{overflow-wrap:anywhere;text-align:right}#app-shell .cp-backup-onboarding .primary{margin-top:8px}#cp-form-error{color:#a92b3a}
</style><p>Revisión de Spino · datos de prueba. Estos controles no acceden a tu Drive.</p><main id="app-shell"><h1>Copia y sincronización</h1><div id="entry"></div><section class="cp-card"><h2>Google Drive</h2><p>4-Spino · conectado</p><p>Historial actualizado</p><button type="button" data-action="storage-manage">Ver mis copias</button></section></main><dialog id="cp-dialog"></dialog><script type="module">
import {createStorageUI} from '/src/companion/storage-ui.js';import {setAppLanguage} from '/src/companion/locale.js';setAppLanguage('es');
const dialog=document.querySelector('dialog'),entry=document.querySelector('#entry');
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));const state={config:{name:'4-Spino.json'},status:'idle'};
const folders=[{id:'current',name:'Spino'},{id:'practice',name:'Mis prácticas'}];
const manager={state,link:()=>({id:'synthetic',notebookId:'synthetic',folderId:'current'}),refresh:async()=>state.config,folders:async()=>folders,folderName:async id=>folders.find(f=>f.id===id)?.name||'Spino',createFolder:async name=>{await sleep(500);return {id:'created-'+folders.length,name};},organize:async value=>{await sleep(3000);state.config={...state.config,...value,storageVersion:'1',storageFolder:value.folderId,principalId:'this-device',principalName:'Este móvil',backupEnabled:'1',backupWifiOnly:value.wifiOnly?'1':'0'};},daily:async()=>{await sleep(1800);state.status='saved';state.config.lastBackupAt=new Date().toISOString();render();},copies:async()=>[{id:'backup',name:'4-Spino.zip',size:12000000,appProperties:{createdAt:state.config.lastBackupAt||new Date().toISOString()}}],settings:async values=>Object.assign(state.config,values),claimPrincipal:async()=>{},};
function showDialog(title,body,accept){dialog.innerHTML=`<div class="cp-dialog-head"><h2>${title}</h2><button type="button" class="quiet" data-action="close-dialog">Cerrar</button></div><div class="cp-dialog-body">${body}<p id="cp-form-error" role="alert"></p></div>`;dialog.querySelector('form')?.addEventListener('submit',async event=>{event.preventDefault();const submit=event.submitter;if(submit)submit.disabled=true;try{await accept?.(new FormData(event.target));}catch(error){dialog.querySelector('#cp-form-error').textContent=error.message;}finally{if(submit)submit.disabled=false;render();}});if(!dialog.open)dialog.showModal();}
const fakeStorage=new Map([['spino.storage.review.v1','shown']]);const cloud={state:{name:'4-Spino.json',notebookId:'synthetic',transport:'drive'}};
const ui=createStorageUI({manager,cloud,showDialog,dialog,deviceName:'Este móvil',storage:{getItem:k=>fakeStorage.get(k),setItem:(k,v)=>fakeStorage.set(k,v)},refresh:async()=>{},formEnd:label=>`<div class="cp-actions"><button type="submit" class="primary">${label||'Guardar'}</button></div>`,exportZip:()=>showDialog('Guardar una copia','<p>En la app se prepara un ZIP completo para guardarlo donde elijas.</p>'),restoreZip:()=>showDialog('Elegir copia','<p>En la app se abre el selector de archivos.</p>'),downloadCopy:()=>showDialog('Revisar copia','<p>En la app se descarga y verifica la copia antes de restaurarla.</p>')});
function render(){entry.innerHTML=ui.entryMarkup();}render();
document.addEventListener('click',async event=>{const button=event.target.closest('[data-action]');if(!button)return;try{if(button.dataset.action==='close-dialog'){dialog.close();return;}await ui.actions[button.dataset.action]?.(button.dataset.id);render();}catch(error){showDialog('No se ha podido terminar',`<p>${error.message}</p>`);}});
</script></html>
