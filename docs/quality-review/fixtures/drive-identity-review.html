<!doctype html><html lang="es" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spino · cuaderno y grabaciones</title><link rel="stylesheet" href="/src/companion/theme.css"><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/layout.css"><link rel="stylesheet" href="/src/companion/app.css"><link rel="stylesheet" href="/src/companion/cloud-backup.css"><style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui;margin:0;padding:20px;background:#f4f5fb;color:#172130}body>p{max-width:560px;margin:0 auto 16px;color:#526071}#app-shell{position:static;display:block;max-width:560px;margin:auto;overflow:visible;border-radius:20px;padding:22px;color-scheme:light;--ink:#172130;--subtle:#526071;--line:#d8dce6;--cream:#f4f5fb;--green:#2861d5;--theme-text:#172130;--theme-muted:#526071;--theme-bg:#f4f5fb;--theme-line:#d8dce6;--theme-accent:#2861d5}#cp-dialog{font:16px/1.5 system-ui;--ink:#172130;--subtle:#526071;--line:#d8dce6;--cream:#f4f5fb;--green:#2861d5;--theme-text:#172130;--theme-muted:#526071;--theme-bg:#f4f5fb;--theme-line:#d8dce6;--theme-accent:#2861d5;color:#172130;background:#f4f5fb;color-scheme:light;max-width:520px;width:calc(100% - 32px)}#cp-dialog::backdrop{background:#17213066}.cp-row{gap:20px;align-items:start}.cp-row span{overflow-wrap:anywhere;text-align:right}#app-shell .cp-backup-onboarding .primary{margin-top:8px}#cp-form-error{color:#a92b3a}
body{display:block}#app-shell{padding:0}button{margin:4px}nav{max-width:560px;margin:auto}.cp-card{margin:12px 0}</style><p>Revisión con datos sintéticos. No accede a tu Google Drive.</p><nav><button id="connected">Cuaderno conectado</button><button id="manage">Gestionar conexión</button><button id="picker">Elegir cuaderno</button><button id="verify">Comprobar grabación y ZIP</button></nav><main id="app-shell"></main><p id="result" role="status"></p><dialog id="cp-dialog"></dialog><script type="module">
import {driveSyncMarkup,driveManageMarkup} from '/src/companion/drive-sync-view.js';
import {driveNotebookPickerMarkup} from '/src/companion/drive-notebook-view.js';
import {setAppLanguage} from '/src/companion/locale.js';
import {syntheticDrive} from '/src/companion/drive-media-fixture.js';
import {createDriveMedia} from '/src/companion/drive-media.js';
import {createDriveStorage} from '/src/companion/drive-storage.js';
import {inspectCompleteBackup} from '/src/companion/complete-backup.js';
import {emptyData} from '/src/companion/model.js';
setAppLanguage('es');
const state={transport:'drive',name:'5_Mi cuaderno.json',fileId:'synthetic-shared-NOTEBOOK-005',folderId:'synthetic-objects',storageFolderId:'synthetic-folder',storageFolderName:'Mi carpeta de Spino',account:{id:'synthetic',email:'prueba@example.invalid'},enabled:true,status:'saved',lastCheckedAt:new Date().toISOString()},app=document.querySelector('main'),dialog=document.querySelector('dialog');
const options={lang:'es',driveAvailable:true,media:{status:'saved'}};
function show(title,body){dialog.innerHTML=`<div class="cp-dialog-head"><h2>${title}</h2><button id="close" class="quiet">Cerrar</button></div><div class="cp-dialog-body">${body}</div>`;dialog.querySelector('#close').onclick=()=>dialog.close();if(!dialog.open)dialog.showModal();}
document.querySelector('#connected').onclick=()=>app.innerHTML=driveSyncMarkup(state,options);
document.querySelector('#manage').onclick=()=>show('Gestionar conexión',driveManageMarkup(state,options));
document.querySelector('#picker').onclick=()=>show('Elegir cuaderno',driveNotebookPickerMarkup(state.account,[{id:state.fileId,name:state.name,appProperties:{}},{id:'synthetic-other-NOTEBOOK-002',name:'2_Copia anterior.json',appProperties:{}}],{lang:'es'}));
document.querySelector('#verify').onclick=async()=>{const result=document.querySelector('#result');result.textContent='Verificando el original y preparando el ZIP…';try{
 const server=syntheticDrive(),map=new Map(),client=createDriveMedia({request:server.request,state:{get:async k=>map.get(k),set:async(k,v)=>map.set(k,v)},accountId:'synthetic',notebookId:'synthetic-book'});
 const original={id:'take',workId:'',title:'Grabación de prueba',createdAt:'2026-10-25T08:00:00Z',durationMs:1000,kind:'audio',blob:new Blob(['verified original recording'],{type:'audio/webm'})};
 const file=await client.upload({...original,takeId:'take'});server.files.get(file.id).mimeType='application/octet-stream';delete server.files.get(file.id).appProperties.spinoMimeType;
 const manager=createDriveStorage({drive:{storageLink:()=>({id:'synthetic-root',folderId:'synthetic-folder',accountId:'synthetic',notebookId:'synthetic-book'})},mediaClient:async()=>client,mediaStore:{index:async()=>{const {blob,...row}=original;return [row];},get:async()=>original},snapshot:async()=>JSON.stringify({format:'cuaderno-piano',version:1,data:emptyData(),assets:[],legacy:{}})});
 const backup=await manager.complete(),restored=await inspectCompleteBackup(backup.blob);
 if(await restored.records[0].blob.text()!=='verified original recording'||server.files.size!==1)throw Error('Verification failed');
 result.textContent='Verificado: formato corregido, archivo original conservado, ZIP completo y grabación recuperada sin duplicados.';
 }catch(error){result.textContent=error.message;}};
document.addEventListener('click',e=>{if(e.target.closest('[data-action="cloud-manage"]'))document.querySelector('#manage').click();});document.querySelector('#connected').click();
</script></html>
