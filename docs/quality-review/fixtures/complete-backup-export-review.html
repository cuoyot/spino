<!doctype html><html lang="es" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spino · prueba de copia ZIP</title><link rel="stylesheet" href="/src/companion/theme.css"><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/layout.css"><link rel="stylesheet" href="/src/companion/app.css"><style>

</style><p>Datos sintéticos. Esta prueba no accede a Drive ni a tu cuaderno.</p><main id="app-shell"><h1>Copia y sincronización</h1><div id="status"></div><button id="export" class="primary">Guardar una copia</button><p>Simula un fallo de red al preparar el ZIP. El reintento genera una copia verificada con un cuaderno vacío y una grabación de prueba.</p></main><dialog id="cp-dialog"></dialog><script type="module">
import {createCompleteBackupExport} from '/src/companion/complete-backup-ui.js';
import {createCompleteBackup} from '/src/companion/complete-backup.js';
import {emptyData} from '/src/companion/model.js';
import {setAppLanguage} from '/src/companion/locale.js';setAppLanguage('es');
const dialog=document.querySelector('dialog');let attempt=0;
function showDialog(title,body,accept){dialog.innerHTML=`<div class="cp-dialog-head"><h2>${title}</h2><button type="button" class="quiet" data-close>Cerrar</button></div><div class="cp-dialog-body">${body}</div>`;dialog.querySelector('[data-close]').onclick=()=>dialog.close();dialog.querySelector('form')?.addEventListener('submit',async event=>{event.preventDefault();event.submitter.disabled=true;await accept();});if(!dialog.open)dialog.showModal();}
const record={id:'test-recording',workId:'',title:'Prueba',createdAt:'2026-10-24T12:00:00Z',kind:'audio',blob:new Blob(['synthetic-audio'],{type:'audio/webm'})};
const controller=createCompleteBackupExport({dialog,showDialog,formEnd:label=>`<div class="cp-actions"><button class="primary" type="submit">${label}</button></div>`,setBusy:()=>{},changed:()=>{document.querySelector('#status').innerHTML=controller.markup();},prepare:async()=>{await new Promise(resolve=>setTimeout(resolve,700));if(!attempt++)throw Error('The Drive server could not be reached. Check the connection and retry.');return createCompleteBackup({text:JSON.stringify({format:'cuaderno-piano',version:1,data:emptyData(),assets:[],legacy:{}}),records:[record],load:async()=>record});},save:async blob=>{document.querySelector('main').insertAdjacentHTML('beforeend',`<p role="status">ZIP sintético verificado: ${blob.size} bytes. En Android se abriría el selector para compartir.</p>`);}});document.querySelector('#export').onclick=controller.open;document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='storage-export')controller.open();if(action==='storage-export-new')controller.startNew();});
</script></html>
