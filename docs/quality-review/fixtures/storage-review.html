<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/companion/app.css"><title>Spino · revisión sintética de copias</title><body class="cp-app" style="font:15px/1.45 system-ui,sans-serif"><main id="app-shell"><div class="cp-page"><h1>Revisión de sincronización</h1><p>Datos sintéticos · no conectado a Drive</p><button id="open">Abrir ajustes</button><button id="notification">Aviso tras actualizar</button><p id="result"></p></div></main><dialog id="cp-dialog" class="cp-dialog"></dialog><script type="module">
import {createStorageUI} from '/src/companion/storage-ui.js';
import {setAppLanguage} from '/src/companion/locale.js';
setAppLanguage('es');const dialog=document.querySelector('dialog');
const config={name:'4_Spino.json',storageFolder:'folder',principalName:'Teléfono principal',backupEnabled:'1',backupWifiOnly:'1'};
const manager={state:{config,status:'unchanged'},refresh:async()=>config,folderName:async()=> 'Mi carpeta Spino',folders:async()=>[{id:'folder',name:'Mi carpeta Spino'},{id:'another',name:'Mis copias'}],link:()=>({folderId:'folder'}),createFolder:async()=>{},organize:async()=>{},daily:async()=>{},claimPrincipal:async()=>{config.principalName='Tableta';},settings:async v=>Object.assign(config,v),copies:async()=>[{id:'copy',name:'4_Spino_2026-10-24.zip',size:2400000,appProperties:{createdAt:'2026-10-24T10:00:00Z'}}]};
function showDialog(title,body,submit){dialog.innerHTML=`<div class="cp-dialog-head"><h2>${title}</h2><button data-action="close">Cerrar</button></div><div class="cp-dialog-body">${body}<p role="alert" id="error"></p></div>`;dialog.querySelector('form')?.addEventListener('submit',async e=>{e.preventDefault();try{await submit(new FormData(e.target));}catch(err){document.querySelector('#error').textContent=err.message;}});if(!dialog.open)dialog.showModal();}
const formEnd=(label='Guardar')=>`<div class="cp-actions"><button type="button" data-action="close">Cancelar</button><button type="submit" class="primary">${label}</button></div>`;
const ui=createStorageUI({manager,showDialog,dialog,formEnd,toast:()=>{},refresh:async()=>{},exportZip:()=>{},restoreZip:()=>{},downloadCopy:async()=>{},cloud:{state:{name:'4_Spino.json',transport:'drive'},retry:async()=>{}},deviceName:'Tableta'});
document.querySelector('#open').onclick=()=>ui.overview();document.querySelector('#notification').onclick=()=>{localStorage.removeItem('spino.storage.review.v1');ui.notify();};dialog.onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;if(['close','close-dialog'].includes(b.dataset.action))dialog.close();else ui.actions[b.dataset.action]?.(b.dataset.id);};ui.overview();
</script></body></html>
